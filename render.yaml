services:
  - type: web
    name: nlp-on-tweets
    env: python
    plan: free
    region: oregon
    pythonVersion: "3.10.12"
    buildCommand: >-
      pip install --upgrade pip setuptools wheel &&
      pip install -r requirements.txt &&
      cd ml/backend &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate --run-syncdb
    startCommand: cd ml/backend && gunicorn backend.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: nlp-on-tweets.onrender.com
      - key: PIP_NO_CACHE_DIR
        value: "1"
